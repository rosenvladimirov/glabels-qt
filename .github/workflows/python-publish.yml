name: python-glabels wheel

# Every push to master builds the self-contained wheel and smoke-tests it in a
# clean container. A tag vX.Y.Z (matching `version` in pyproject.toml) also
# publishes it to PyPI with the PYPI_API_TOKEN secret of the `pypi`
# environment (switch to Trusted Publishing by dropping `password:` once a
# trusted publisher is registered on PyPI).

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "model/**"
      - "backends/**"
      - "glbarcode/**"
      - "python/**"
      - "templates/**"
      - "packaging/python-wheel/**"
      - "pyproject.toml"
      - "CMakeLists.txt"
      - ".github/workflows/python-publish.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build wheel (cp312, Ubuntu 24.04)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml)
          test "v$VER" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject $VER"; exit 1; }
      - name: Build
        run: bash packaging/python-wheel/build.sh . dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  test:
    name: Smoke test in a clean container
    needs: build
    runs-on: ubuntu-latest
    # deliberately bare: no Qt, no fonts — like a headless server
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/python-wheel
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Install and render
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 python3-pip >/dev/null
          pip install --break-system-packages dist/*.whl pypdf
          python3 packaging/python-wheel/smoke_test.py

  publish:
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/python-glabels
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
