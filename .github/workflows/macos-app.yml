name: macOS App

on:
  push:
    branches: [ master, feature/odoo-rpc-merge ]
  workflow_dispatch:

jobs:
  build-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.os }}

    env:
      # Oldest macOS the bundle is expected to run on (Qt 6.8 supports 12+)
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      # qrencode and zint are built from source and land under /usr/local
      PKG_CONFIG_PATH: '/usr/local/lib/pkgconfig'

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build tools
      shell: bash
      run: brew install pkgconf librsvg

    - name: Build optional barcode libraries from source
      shell: bash
      run: |
        # Homebrew bottles target the runner's macOS, which would raise the
        # minimum version of the bundle; build these two against our target.
        set -e
        mkdir -p deps && cd deps
        curl -fsSL -o qrencode.tar.gz \
          https://github.com/fukuchi/libqrencode/archive/refs/tags/v4.1.1.tar.gz
        tar xzf qrencode.tar.gz
        # qrencode asks for CMake 3.1; CMake 4 refuses anything below 3.5
        cmake -S libqrencode-4.1.1 -B build-qrencode \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
          -DWITH_TOOLS=NO -DWITH_TESTS=NO -DBUILD_SHARED_LIBS=ON
        cmake --build build-qrencode -j3
        sudo cmake --install build-qrencode
        curl -fsSL -o zint.tar.gz https://downloads.sourceforge.net/project/zint/zint/2.15.0/zint-2.15.0-src.tar.gz
        tar xzf zint.tar.gz
        # Keep the default frontend: FindLibZint.cmake reads the version
        # from the installed zint command, zint.h no longer carries it.
        cmake -S zint-2.15.0-src -B build-zint \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
        cmake --build build-zint -j3
        sudo cmake --install build-zint
        # Fail here rather than silently building an app without barcodes
        test -f /usr/local/lib/libqrencode.dylib
        test -f /usr/local/lib/libzint.dylib
        command -v zint

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        install-deps: 'true'
        archives: 'qtbase qtsvg qttools qttranslations qtdeclarative'

    - name: Configure CMake
      shell: bash
      run: |
        set -o pipefail
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/staging \
          -S ${{ github.workspace }} 2>&1 | tee cmake-config.log
        # The barcode backends are optional, so a missing library is only a
        # line in the configure output; the app would ship without them.
        grep -E '^-- (qrencode|libzint) \(optional\)' cmake-config.log
        ! grep -E '^-- (qrencode|libzint) \(optional\)\.+ No\.' cmake-config.log

    - name: Build
      run: cmake --build build --config Release -j3

    - name: Install to staging prefix
      run: cmake --install build

    - name: Build application icon
      shell: bash
      run: |
        set -e
        ICONSET=glabels.iconset
        mkdir -p $ICONSET
        SVG=glabels/icons/glabels-flat/scalable/apps/glabels.svg
        for size in 16 32 128 256 512; do
          rsvg-convert -w $size -h $size "$SVG" -o $ICONSET/icon_${size}x${size}.png
          double=$((size * 2))
          rsvg-convert -w $double -h $double "$SVG" -o $ICONSET/icon_${size}x${size}@2x.png
        done
        iconutil -c icns $ICONSET -o glabels.icns

    - name: Assemble application bundle
      shell: bash
      run: |
        set -e
        APP=gLabels.app
        rm -rf "$APP"
        mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
        cp staging/bin/glabels-qt "$APP/Contents/MacOS/"
        cp staging/bin/glabels-batch-qt "$APP/Contents/MacOS/"
        # FileUtil looks for Contents/Resources/share/glabels-qt/{templates,translations}
        mkdir -p "$APP/Contents/Resources/share"
        cp -R staging/share/glabels-qt "$APP/Contents/Resources/share/"
        cp glabels.icns "$APP/Contents/Resources/"
        VERSION=$(head -1 build/VERSION.txt | tr -d ' ')
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        cat > "$APP/Contents/Info.plist" <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleName</key>              <string>gLabels</string>
          <key>CFBundleDisplayName</key>       <string>gLabels</string>
          <key>CFBundleExecutable</key>        <string>glabels-qt</string>
          <key>CFBundleIdentifier</key>        <string>org.glabels.glabels-qt</string>
          <key>CFBundleIconFile</key>          <string>glabels.icns</string>
          <key>CFBundlePackageType</key>       <string>APPL</string>
          <key>CFBundleShortVersionString</key><string>${VERSION}</string>
          <key>CFBundleVersion</key>           <string>${VERSION}</string>
          <key>LSMinimumSystemVersion</key>    <string>${MACOSX_DEPLOYMENT_TARGET}</string>
          <key>NSHighResolutionCapable</key>   <true/>
          <key>CFBundleDocumentTypes</key>
          <array>
            <dict>
              <key>CFBundleTypeName</key>         <string>gLabels Project</string>
              <key>CFBundleTypeRole</key>         <string>Editor</string>
              <key>CFBundleTypeExtensions</key>   <array><string>glabels</string></array>
              <key>CFBundleTypeIconFile</key>     <string>glabels.icns</string>
              <key>LSHandlerRank</key>            <string>Owner</string>
            </dict>
          </array>
        </dict>
        </plist>
        PLIST
        plutil -lint "$APP/Contents/Info.plist"

    - name: Bundle Qt and sign (ad-hoc)
      shell: bash
      run: |
        set -e
        "$QT_ROOT_DIR/bin/macdeployqt" gLabels.app \
          -executable=gLabels.app/Contents/MacOS/glabels-batch-qt \
          -always-overwrite -verbose=1
        # No Developer ID available: ad-hoc signature, required for arm64 to run at all
        codesign --force --deep --sign - --timestamp=none gLabels.app
        codesign --verify --deep --strict --verbose=2 gLabels.app

    - name: Verify the bundle carries its own libraries
      shell: bash
      run: |
        set -e
        leaked=0
        while read -r f; do
          if file "$f" | grep -q "Mach-O"; then
            bad=$(otool -L "$f" | tail -n +2 | awk '{print $1}' \
                  | grep -E '^(/opt/homebrew|/usr/local|'"$QT_ROOT_DIR"')' || true)
            if [ -n "$bad" ]; then
              echo "LEAK in $f:"; echo "$bad"; leaked=1
            fi
          fi
        done < <(find gLabels.app -type f)
        [ "$leaked" -eq 0 ] || { echo "Bundle depends on paths outside itself"; exit 1; }
        echo "Bundle is self-contained"

    - name: Smoke test the bundle
      shell: bash
      run: |
        set -e
        ./gLabels.app/Contents/MacOS/glabels-qt --Version
        # Rendering a label proves the templates and translations are found
        # inside Contents/Resources (FileUtil would qFatal otherwise).
        ./gLabels.app/Contents/MacOS/glabels-batch-qt -o smoke.pdf test-data/simple-shapes.glabels
        ls -l smoke.pdf
        [ -s smoke.pdf ]

    - name: Create DMG
      shell: bash
      run: |
        set -e
        mkdir -p dmgroot
        cp -R gLabels.app dmgroot/
        ln -s /Applications dmgroot/Applications
        DMG=glabels-qt-${VERSION}-macos-${{ matrix.arch }}.dmg
        hdiutil create -volname "gLabels ${VERSION}" -srcfolder dmgroot \
          -fs HFS+ -format UDZO -ov "$DMG"
        hdiutil verify "$DMG"
        ls -lh "$DMG"

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: glabels-macos-${{ matrix.arch }}
        path: glabels-qt-*.dmg
